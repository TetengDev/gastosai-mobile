# The expense list, grouped by day.
#
# It used to be 77 undifferentiated rows for all time, newest first, with a plain substring filter.
# Now it is one month at a time, sectioned by day, with each day's total in the header.
#
# **The day total is asserted because it is server-computed.** `/expenses/report/daily` supplies it;
# summing the rows on the phone would be two lines and would break the invariant that a number the
# user acts on comes from the backend (CLAUDE.md §1.2). If someone ever "simplifies" this by adding
# the rows up locally, a mismatch here is what catches it.
#
# Read-only: creates nothing, cleans up nothing.
appId: host.exp.Exponent
---
- runFlow: launch.yaml

- tapOn:
    id: "tab-expenses"

# Find the foreign-currency fixture rather than naming the day it used to fall on.
#
# This flow asserted "jun 26, 2026", which was that expense's date when seeding began in June. The
# seeded window rolls forward with the calendar, so the same fixture is now dated 2026-03-26 and
# the assertion named a day holding nothing. Ask where it is, then walk there.
- evalScript: |
    ${output.fx = (function(){var body = json(http.get('http://localhost:8080/expenses', {headers: {'Authorization': 'Bearer ' + output.token}}).body); var rows = body.content ? body.content : body; var hit = null; for (var i = 0; i < rows.length; i++) { if (rows[i].currency === 'JPY') { hit = rows[i]; break; } } var ymd = hit.date.slice(0, 10); var y = Number(ymd.slice(0, 4)), m = Number(ymd.slice(5, 7)), d = Number(ymd.slice(8, 10)); var abbr = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; var full = ['January','February','March','April','May','June','July','August','September','October','November','December']; var ty = Number(output.thisKey.slice(0, 4)), tm = Number(output.thisKey.slice(5, 7)); return {steps: (ty - y) * 12 + (tm - m), dayLabel: abbr[m - 1] + ' ' + d + ', ' + y, monthLabel: full[m - 1] + ' ' + y, base: '₱' + Number(hit.amountInBaseCurrency).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','), raw: '₱' + Number(hit.amount).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')};})()}

# Step back to the month holding it.
- repeat:
    times: ${output.fx.steps}
    commands:
      - tapOn:
          id: "month-prev"
- extendedWaitUntil:
    visible: "(?i).*${output.fx.monthLabel}.*"
    timeout: 20000

# A day section header, with the total the server computed for that day.
- extendedWaitUntil:
    visible: "(?i).*${output.fx.dayLabel}.*"
    timeout: 20000

# The row and its header must agree. That day holds one expense, recorded in JPY — the row used to
# render the raw amount as pesos ("₱1,500.00") while the header read the converted figure
# (₱577.50), two numbers for the same thing on the same screen. Both are the converted one now.
#
# Both figures come from the expense itself, so the assertion keeps meaning if the fixture's
# amount or the rate ever changes: `amountInBaseCurrency` is what must be shown, and the raw
# `amount` rendered as pesos is precisely what must not.
- assertVisible: "(?i).*${output.fx.base}.*"
- assertNotVisible: "${output.fx.raw}"
- assertVisible: "(?i).*1,500.00 jpy.*"

# Search narrows within the month rather than across all time.
- tapOn:
    id: "expense-search"
# Erase first: `inputText` appends, so a re-run against a field that still holds the previous
# query types "CommuteCommute" and matches nothing — a failure that looks like a broken filter.
- eraseText
- inputText: "Commute"
- hideKeyboard
# `.*` on both sides: an expense row is a Pressable with accessibilityRole="button", so everything
# inside it collapses into a single accessibility node — "Commute fare, Transportation, ₱90.00".
# Maestro matches whole nodes, so a bare "Commute fare" fails against a screen showing six of them.
- extendedWaitUntil:
    visible: "(?i).*commute fare.*"
    timeout: 15000
# A description that exists in June but does not match the query must be gone.
- assertNotVisible: "(?i).*jpy meal plan import.*"

- tapOn:
    id: "search-clear"
- extendedWaitUntil:
    visible: "(?i).*jpy meal plan import.*"
    timeout: 15000
