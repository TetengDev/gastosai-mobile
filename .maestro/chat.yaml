# Ask AI reachable in one tap from every tab, and back returning to where you started.
#
# Web mounts its chat widget at the app root, so it floats on every page. On mobile it used to be
# three taps down inside More. The header icon is the equivalent — but only if it is on *every*
# tab, which is what this asserts rather than assumes.
#
# The back assertion is the subtle half. Chat declares `parent: "/(app)/more"` for the case where
# you open it from the hub; opened from Budgets it carries `from`, and back must honour that. A
# chat you can reach from anywhere but which always dumps you on More is the "lose my place"
# complaint again, one level down.
#
# Read-only: sends no messages, so nothing to clean up.
appId: host.exp.Exponent
---
- runFlow: launch.yaml

# From Home.
- tapOn:
    id: "tab-home"
- tapOn:
    id: "header-chat"
- extendedWaitUntil:
    visible: "(?i).*ask about your spending.*"
    timeout: 20000
- tapOn:
    id: "header-back"
- extendedWaitUntil:
    visible: "(?i).*spent this month.*"
    timeout: 20000

# From Expenses — and back must land on Expenses, not on More or Home.
- tapOn:
    id: "tab-expenses"
- tapOn:
    id: "header-chat"
- extendedWaitUntil:
    visible: "(?i).*ask about your spending.*"
    timeout: 20000
- tapOn:
    id: "header-back"
- extendedWaitUntil:
    visible: "Search this month"
    timeout: 20000

# From Budgets.
- tapOn:
    id: "tab-budgets"
- tapOn:
    id: "header-chat"
- extendedWaitUntil:
    visible: "(?i).*ask about your spending.*"
    timeout: 20000
- tapOn:
    id: "header-back"
- extendedWaitUntil:
    visible: "(?i).*safe to spend.*"
    timeout: 20000

# From Goals.
- tapOn:
    id: "tab-goals"
- tapOn:
    id: "header-chat"
- extendedWaitUntil:
    visible: "(?i).*ask about your spending.*"
    timeout: 20000
- tapOn:
    id: "header-back"
- assertVisible:
    id: "goals-screen"

# From More, where the hub row also still works.
- tapOn:
    id: "tab-more"
- tapOn:
    id: "header-chat"
- extendedWaitUntil:
    visible: "(?i).*ask about your spending.*"
    timeout: 20000
- tapOn:
    id: "header-back"
- extendedWaitUntil:
    visible: "(?i).*recurring.*bills and subscriptions.*"
    timeout: 20000

# ── What the reply actually contains ────────────────────────────────────────────────────────────
#
# These are the assertions that would have caught the bug you reported. The old screen rendered
# `message` only, so a "did a reply appear" check passed while the data was dropped on the floor.
# Asserting a *figure from the result* is what distinguishes the two.
#
# June, not the current month: this account's data ends in June, and asking about an empty month
# returns an empty result — correct, but it proves nothing about rendering.
- tapOn:
    id: "tab-home"
- tapOn:
    id: "header-chat"

- tapOn:
    id: "chat-input"
- inputText: "How much did I spend on food in June 2026?"
- hideKeyboard
- tapOn:
    id: "chat-send"
# The model has to run a tool, so this waits far longer than a normal UI assertion — and longer
# than the request's own 90s timeout in `src/api/chat.ts`. Matching the two exactly means the wait
# dies in the same instant the client aborts, so a slow reply that *would* have rendered reports as
# a missing element instead. This passed at 90s only because this query happens to be quick.
- extendedWaitUntil:
    visible:
      id: "chat-result"
    timeout: 120000
- assertVisible: "(?i).*meal plan.*"
# The figure itself. ₱3,347.50 is June's Meal Plan total, computed server-side — the client cannot
# invent it, and rendering only the caption cannot produce it.
- assertVisible: "₱3,347.50"

# An empty result is a real answer and must say so, rather than showing a caption over nothing —
# which is exactly what "Category totals for 2026-07." looked like.
- tapOn:
    id: "chat-input"
- inputText: "How much did I spend on food in July 2026?"
- hideKeyboard
- tapOn:
    id: "chat-send"
- extendedWaitUntil:
    visible: "No results found."
    timeout: 120000
