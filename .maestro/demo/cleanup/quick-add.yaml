# Undoes what the filmed quick-add demo created. Runs *after* the recording stops.
#
# A demo has to leave the account as it found it or the second run shows two lunches and the third
# shows three. Tidying up is not part of the product, so it does not belong on camera —
# `record-demo.sh` stops the recorder, then runs this if a file of the same name exists here.
#
# Deliberately tolerant: if the demo failed before saving anything there is nothing to remove, and
# this must not turn a clean failure into a confusing second one. Hence the `runFlow when`.
appId: host.exp.Exponent
---
- launchApp:
    clearState: false
- runFlow:
    when:
      notVisible:
        id: "tab-home"
    commands:
      - tapOn: "(?i).*gastosai.*"
      - extendedWaitUntil:
          visible:
            id: "tab-home"
          timeout: 60000

# The demo ends on the current month, which is where a just-saved expense lands.
- tapOn:
    id: "tab-expenses"

- runFlow:
    when:
      visible: "(?i).*₱177.00.*"
    commands:
      - tapOn:
          id: "expense-row-first"
      - assertVisible: "Edit expense"
      # Checked before deleting: the demo created a ₱177 expense, and anything else on this row is
      # not ours to remove.
      - assertVisible: "177"
      - tapOn: "Delete expense"
      - assertVisible: "Delete expense?"
      - tapOn: "Delete"
      - extendedWaitUntil:
          notVisible: "(?i).*₱177.00.*"
          timeout: 20000
