# Demo: Home as a dashboard you can read, not a screen you check in on.
#
# **This flow is filmed.** Written for someone who has never seen the app — a client, not a
# reviewer. The rules are the same as `chat.yaml`: no housekeeping on camera, open and close on a
# full screen, and use last month rather than the current one, because the current month is only
# partly spent and a thin month is honest but says little.
#
# **No figure is written down here.** This flow asserted June's ₱9,049.50 and 38.71% until the demo
# seed began generating expenses relative to today (backend `b02d467`): from then on June held
# different numbers every month and the recorder refused every take. The figures are asked of the
# same endpoints the screen reads, the way `.maestro/dashboard.yaml` does — still numbers the client
# cannot invent.
#
# Read-only. It creates nothing, so there is no cleanup flow for it.
#
# Narration lives in `label:` lines beginning `>> ` — see `chat.yaml`'s header and
# `.maestro/README.md`. What actually guards this behaviour is `.maestro/dashboard.yaml`.
#
# @watch Every figure is computed by the server
# @watch One answer at the top, Piso beside it
# @watch The report opens on purpose, not by scrolling
appId: host.exp.Exponent
---
- runFlow: ../launch.yaml

- tapOn:
    id: "tab-home"
- tapOn:
    id: "month-prev"
- extendedWaitUntil:
    visible: "(?i).*${output.prevMonth}.*"
    timeout: 25000
    label: ">> Last month, with something to show"

# Off camera: what the server says last month was. `changePercent` is signed, the prose around it
# never is — hence the magnitude. See `.maestro/dashboard.yaml` for both.
- evalScript: |
    ${output.cmp = json(http.get('http://localhost:8080/expenses/report/monthly-comparison?month=' + output.prevKey, {headers: {'Authorization': 'Bearer ' + output.token}}).body)}
- evalScript: |
    ${output.changePct = Math.abs(Number(output.cmp.changePercent)).toFixed(2)}
- evalScript: |
    ${output.topCatRes = http.get('http://localhost:8080/ai/insights/top-category?month=' + output.prevKey, {headers: {'Authorization': 'Bearer ' + output.token}})}
- assertTrue:
    condition: ${output.topCatRes.status == 200}
    label: "top-category answered ${output.topCatRes.status}: ${output.topCatRes.body}"
- evalScript: |
    ${output.topCat = json(output.topCatRes.body)}

# The hero first: the month's figure with Piso beside it and one plain status line.
- extendedWaitUntil:
    visible:
      id: "home-status"
    timeout: 20000
    label: ">> One answer first: how the month is going"
- scrollUntilVisible:
    element:
      id: "card-goals"
    direction: DOWN
    label: ">> Savings goals in the same glance"

# Insights is collapsed by default; opening it is the deliberate second look.
# Centred, not merely "visible": at the bottom edge the toggle sits under the tab bar, and a tap
# there lands on the Budgets tab instead.
- scrollUntilVisible:
    element:
      id: "insights-toggle"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "insights-toggle"
    label: ">> The full report, one tap away"

# The insight sentence: the figure the client cannot invent.
#
# The percentage only, never the prose around it — that is a model's wording and it moves between
# runs. `Biggest category:` is app-rendered, so it is the safe way to prove the card resolved rather
# than still showing a spinner.
- scrollUntilVisible:
    element:
      text: "(?i).*${output.changePct}%.*"
    direction: DOWN
    timeout: 30000
    label: ">> Written by the server, not the phone"
# Scrolled to, not asserted in place: the sentence above it is a model's prose of any length, and
# four lines of it pushed this line below the fold.
- scrollUntilVisible:
    element:
      text: "(?i).*biggest category: ${output.topCat.category}.*"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "card-top"
    direction: DOWN
    label: ">> The biggest expenses, ranked"
- scrollUntilVisible:
    element:
      id: "card-categories"
    direction: DOWN
    label: ">> And where the money went"

# Close on the glance, the way it opened.
- scrollUntilVisible:
    element:
      id: "month-label"
    direction: UP
    label: ">> Back to the top"
- extendedWaitUntil:
    visible: "(?i).*${output.prevMonth}.*"
    timeout: 20000
