# Stepping back a month, which is the failure this release exists to fix.
#
# Before v0.6 every screen hard-coded the current month with no control to change it. Today is in
# July 2026 and the demo account's data ends in June, so the app opened on ₱0.00 with six months
# and 77 expenses present but unreachable. That is what "hard to navigate" turned out to mean.
#
# **June's total is asserted as an exact figure on purpose.** ₱9,049.50 comes from
# `/expenses/report/monthly` and appears only if the client is asking the server for the right
# month. A stepper that changed the label without rebinding the queries would still pass a vaguer
# assertion, and that is precisely the bug worth catching.
#
# Read-only: this flow creates nothing, so there is nothing to clean up.
appId: host.exp.Exponent
---
- runFlow: launch.yaml

# Home opens on the current month, which for this account is empty.
- assertVisible: "(?i).*july 2026.*"

- tapOn:
    id: "month-prev"
- extendedWaitUntil:
    visible: "(?i).*june 2026.*"
    timeout: 20000
- extendedWaitUntil:
    visible: "₱9,049.50"
    timeout: 20000

# Forward again, back to an empty July — the stepper has to work in both directions.
- tapOn:
    id: "month-next"
- extendedWaitUntil:
    visible: "(?i).*july 2026.*"
    timeout: 20000

# The empty month offers the nearest month that has data rather than dead-ending on ₱0.00.
- assertVisible: "(?i).*nothing recorded in july 2026.*"
- tapOn:
    id: "jump-to-latest"
- extendedWaitUntil:
    visible: "₱9,049.50"
    timeout: 20000

# The month is shared context, not per-screen state: Expenses and Budgets must already be on June
# without being told again.
- tapOn:
    id: "tab-expenses"
- extendedWaitUntil:
    visible: "(?i).*june 2026.*"
    timeout: 20000

- tapOn:
    id: "tab-budgets"
- extendedWaitUntil:
    visible: "(?i).*june 2026.*"
    timeout: 20000
