# Home as a dashboard, not just a check-in.
#
# **Every assertion here is a figure the client cannot invent.** 38.71% comes from
# `/expenses/report/monthly-comparison`, "Meal Plan" from `/ai/insights/top-category`, ₱1,900.00
# from `/expenses/report/top`. A card that rendered but computed its own numbers would still show
# *something*; it would not show these.
#
# Read-only: creates nothing, cleans up nothing.
appId: host.exp.Exponent
---
- runFlow: launch.yaml

- tapOn:
    id: "tab-home"

# Let the backend's `/ai/**` rate-limit window run out before this flow asks for anything under it.
#
# Every `/ai/**` request — `top-category` included, though it never calls a model — draws on one
# per-user, fixed 60-second window of 20 (`gastos.ratelimit.ai-per-minute`, `AiRateLimitInterceptor`).
# Each month Home shows mounts the insight card, which spends two. `month.yaml` runs just before this
# flow in a directory run and walks Home back through every seeded month, so by the time this flow
# asked for `top-category` the window was full: it answered
# `429 {"title":"Too Many Requests","detail":"AI request rate limit exceeded. Please slow down."}`,
# `.category` of that is `undefined`, and the run failed on `biggest category: undefined`. The app
# was fine: in all five failing runs on 2026-10-13 the failing step's own screen hierarchy shows
# "Biggest category: Meal Plan · ₱4,035.00 · 40% of the month" (TEN-461). Alone, the flow starts
# with an empty window and passed — which is why it only ever failed in the full suite.
#
# Sixty-one seconds of nothing is the deterministic way through: whatever spent the window, it has
# expired by the next request, and this flow then spends three (the app's two for last month and
# the one below). Nothing on screen is waited for — the id never exists — and `optional` turns the
# timeout into a warning rather than a failure. Retrying on 429 instead would be no faster: a
# refused request does not move the window, and there is no `Retry-After` to read.
- extendedWaitUntil:
    visible:
      id: "ai-rate-limit-window-elapsed"
    timeout: 61000
    optional: true

- tapOn:
    id: "month-prev"
- extendedWaitUntil:
    visible: "(?i).*${output.prevMonth}.*"
    timeout: 25000

# What last month's figures *are*, asked of the same endpoints the screen reads. The percentage,
# the category and the top amount were written down as 38.71%, "meal plan" and ₱1,900.00 — true of
# June when June was last month, and wrong from the day the calendar moved. Asking keeps the
# original point intact: these are numbers the client cannot invent, and a card that computed its
# own would still not match the server's.
- evalScript: |
    ${output.cmp = json(http.get('http://localhost:8080/expenses/report/monthly-comparison?month=' + output.prevKey, {headers: {'Authorization': 'Bearer ' + output.token}}).body)}
# Kept as the whole response, not just its body: when this was `json(...body)` alone, a 429 surfaced
# three steps later as `biggest category: undefined`, which named neither the status nor the cause.
- evalScript: |
    ${output.topCatRes = http.get('http://localhost:8080/ai/insights/top-category?month=' + output.prevKey, {headers: {'Authorization': 'Bearer ' + output.token}})}
- assertTrue:
    condition: ${output.topCatRes.status == 200}
    label: "top-category answered ${output.topCatRes.status}: ${output.topCatRes.body}"
- evalScript: |
    ${output.topCat = json(output.topCatRes.body)}
- evalScript: |
    ${output.topExp = json(http.get('http://localhost:8080/expenses/report/top?month=' + output.prevKey, {headers: {'Authorization': 'Bearer ' + output.token}}).body)[0]}
# Peso formatting the app's own way — thousands separators and two decimals — so the assertion
# compares what is rendered, not a bare number that would never appear on screen.
#
# `amountInBaseCurrency`, never the raw `amount`: a ¥1,500 expense is not ₱1,500, and TopExpensesCard
# renders the converted figure. Reading `amount` here passed only because this month's largest
# expense happens to be in pesos, and would have asserted ¥1,500 against a card showing ₱577.50 the
# first month a foreign-currency expense topped the list — the exact confusion expenses.yaml in this
# same suite exists to catch.
- evalScript: |
    ${output.topAmount = '₱' + Number((output.topExp.amountInBaseCurrency === null || output.topExp.amountInBaseCurrency === undefined) ? output.topExp.amount : output.topExp.amountInBaseCurrency).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}
# The magnitude, not the signed value. `changePercent` is negative when spending fell — it is
# -51.83 for this August — while the sentence around it is model-generated prose that carries the
# direction in words ("down 51.83% from", "51.83% lower") and never a minus sign. Interpolating the
# raw value asserts "-51.83%" against text that will never contain it. This passed only because the
# month it currently reads rose; it would have failed next month, which is the same expiry this
# branch exists to remove.
- evalScript: |
    ${output.changePct = Math.abs(Number(output.cmp.changePercent)).toFixed(2)}

# The insight sentence, generated server-side.
#
# **The percentage only — never a word of the prose.** This asserted `38.71% lower` and passed for
# weeks on wording the model happened to keep choosing; the run that broke it said "down 38.71%
# from" instead. The figure is computed by
# `/expenses/report/monthly-comparison` and is stable; every word around it is a model's phrasing and
# will change again. `Biggest category:` below is app-rendered, so it *is* safe to match, and it is
# what actually proves the insight card resolved rather than a spinner.
- extendedWaitUntil:
    visible: "(?i).*${output.changePct}%.*"
    timeout: 30000
- assertVisible: "(?i).*biggest category: ${output.topCat.category}.*"

# The trend card's comparison against last month.
- assertVisible:
    id: "trend-change"

# The list cards. Each is scrolled to rather than assumed on screen — this is a dashboard you read
# by scrolling, which is the deliberate trade for keeping the glance intact at the top.
- scrollUntilVisible:
    element:
      id: "card-top"
    direction: DOWN
# The largest expense of that month, ranked by the backend rather than named here.
- assertVisible: "(?i).*${output.topAmount}.*"

- scrollUntilVisible:
    element:
      id: "card-goals"
    direction: DOWN

- scrollUntilVisible:
    element:
      id: "card-categories"
    direction: DOWN
# Labelled all-time on purpose: /expenses/report/category takes no month, so this card cannot
# follow the stepper and says so rather than implying June-only figures.
- assertVisible: "(?i).*by category · all time.*"
