# Home as a dashboard, not just a check-in.
#
# **Every assertion here is a figure the client cannot invent.** 38.71% comes from
# `/expenses/report/monthly-comparison`, "Meal Plan" from `/ai/insights/top-category`, ₱1,900.00
# from `/expenses/report/top`. A card that rendered but computed its own numbers would still show
# *something*; it would not show these.
#
# Read-only: creates nothing, cleans up nothing.
appId: host.exp.Exponent
---
- runFlow: launch.yaml

- tapOn:
    id: "tab-home"
- tapOn:
    id: "month-prev"
- extendedWaitUntil:
    visible: "(?i).*${output.prevMonth}.*"
    timeout: 25000

# What last month's figures *are*, asked of the same endpoints the screen reads. The percentage,
# the category and the top amount were written down as 38.71%, "meal plan" and ₱1,900.00 — true of
# June when June was last month, and wrong from the day the calendar moved. Asking keeps the
# original point intact: these are numbers the client cannot invent, and a card that computed its
# own would still not match the server's.
- evalScript: |
    ${output.cmp = json(http.get('http://localhost:8080/expenses/report/monthly-comparison?month=' + output.prevKey, {headers: {'Authorization': 'Bearer ' + output.token}}).body)}
- evalScript: |
    ${output.topCat = json(http.get('http://localhost:8080/ai/insights/top-category?month=' + output.prevKey, {headers: {'Authorization': 'Bearer ' + output.token}}).body)}
- evalScript: |
    ${output.topExp = json(http.get('http://localhost:8080/expenses/report/top?month=' + output.prevKey, {headers: {'Authorization': 'Bearer ' + output.token}}).body)[0]}
# Peso formatting the app's own way — thousands separators and two decimals — so the assertion
# compares what is rendered, not a bare number that would never appear on screen.
- evalScript: |
    ${output.topAmount = '₱' + Number(output.topExp.amount).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}

# The insight sentence, generated server-side.
#
# **The percentage only — never a word of the prose.** This asserted `38.71% lower` and passed for
# weeks on wording the model happened to keep choosing; the run that broke it said "down 38.71%
# from" instead. The figure is computed by
# `/expenses/report/monthly-comparison` and is stable; every word around it is a model's phrasing and
# will change again. `Biggest category:` below is app-rendered, so it *is* safe to match, and it is
# what actually proves the insight card resolved rather than a spinner.
- extendedWaitUntil:
    visible: "(?i).*${output.cmp.changePercent}%.*"
    timeout: 30000
- assertVisible: "(?i).*biggest category: ${output.topCat.category}.*"

# The trend card's comparison against last month.
- assertVisible:
    id: "trend-change"

# The list cards. Each is scrolled to rather than assumed on screen — this is a dashboard you read
# by scrolling, which is the deliberate trade for keeping the glance intact at the top.
- scrollUntilVisible:
    element:
      id: "card-top"
    direction: DOWN
# The largest expense of that month, ranked by the backend rather than named here.
- assertVisible: "(?i).*${output.topAmount}.*"

- scrollUntilVisible:
    element:
      id: "card-goals"
    direction: DOWN

- scrollUntilVisible:
    element:
      id: "card-categories"
    direction: DOWN
# Labelled all-time on purpose: /expenses/report/category takes no month, so this card cannot
# follow the stepper and says so rather than implying June-only figures.
- assertVisible: "(?i).*by category · all time.*"
