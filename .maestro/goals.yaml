# Create a goal, contribute to it, then delete it.
#
# **What this flow is really checking is that nothing is computed on the phone.** After the
# contribution it asserts the *percentage*, which the client never calculates — `progressPercent`
# comes from the backend. If someone ever "optimises" the screen by advancing the bar locally, the
# figure here is what disagrees.
#
# ₱4,000 saved against a ₱10,000 target is 40%, and 40 is chosen because it cannot be reached by
# rounding a different pair of numbers that a bug might produce.
#
# The goal is created and deleted by this flow, so cleanup is unambiguous — nothing matches on a
# value that seeded data could also hold.
appId: host.exp.Exponent
---
- runFlow: launch.yaml

- tapOn:
    id: "tab-goals"

- tapOn:
    id: "goal-create"
# Assert on the sheet's own Cancel, not on "New goal": that string is also the label of the button
# just tapped, so matching it passes whether or not the sheet actually opened — the assertion would
# be decorative, and a sheet that failed to present would be caught a step later with a confusing
# "sheet-amount not found".
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 15000

- tapOn:
    id: "sheet-amount"
- inputText: "10000"
# The decimal keypad covers Save and has no return key of its own.
- tapOn:
    id: "sheet-amount-done"
- tapOn:
    id: "sheet-label"
- inputText: "Maestro Test Goal"
- hideKeyboard
- tapOn:
    id: "sheet-save"

- extendedWaitUntil:
    visible: "Maestro Test Goal"
    timeout: 20000
- assertVisible: "(?i).*₱0.00 of ₱10,000.00.*"

# Contribute. The sheet opens pre-filled with the current saved amount, so this replaces it.
- tapOn: "Add savings"
- tapOn:
    id: "sheet-amount"
- eraseText
- inputText: "4000"
- tapOn:
    id: "sheet-amount-done"
- tapOn:
    id: "sheet-save"

# 40% is server-computed. This is the assertion that would fail if the client ever did the maths.
- extendedWaitUntil:
    visible: "(?i).*₱4,000.00 of ₱10,000.00 · 40%.*"
    timeout: 20000

# Clean up: the flow created this goal, so it deletes it. Secondary actions moved behind the row's
# `⋯` menu in v0.6, and the menu is addressed positionally — the new goal sorts to the top, and its
# id is not knowable in advance because this flow just created it.
- tapOn:
    id: "goal-menu-0"
# The menu item ends in an ellipsis, iOS shorthand for "a confirmation follows". That also keeps it
# distinct from the alert's own button, which a bare "Delete" on both would not.
- tapOn: "Delete goal…"
- assertVisible: "(?i).*delete .maestro test goal.*"
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: "Maestro Test Goal"
    timeout: 20000
