# Edit then delete an expense — the capture loop's correction path.
#
# Until v0.2 this was impossible in the app at all: the API wrappers existed with no UI. This
# asserts the hole is closed from the user's side, and cleans up after itself so the flow can be
# re-run against a shared dev database.
#
# Creates its own ₱177.00 expense through the API first (see below).
#
# **Entered from the Expenses tab, not Home's Recent card.** Home became a dashboard in v0.7, so
# Recent now sits below seven cards: reaching it needs a scroll, and how far depends on how many
# cards happen to render. Expenses is where you would actually go to open an expense, it is scoped
# to the current month, and its list starts at the top of the screen.
#
# Matching on the amount is safe *on this screen specifically* — Expenses has no month-total tile,
# so ₱226.53 appears exactly once. On Home the same string appears twice and the tile is not
# pressable, which is why an earlier version of this flow tapped nothing and failed a step later.
#
# Before anything is deleted the flow re-opens the row and checks the amount on the edit screen, so
# a mistargeted row cannot be destroyed silently. Matching loosely on a round ₱175.00 is how a
# seeded expense was lost during the original Maestro bring-up.
appId: host.exp.Exponent
env:
  GASTOSAI_EMAIL: demo@gastosai.dev
  GASTOSAI_PASSWORD: demo123

# The cleanup script (scripts/cleanup-expenses.js, shared with quick-add.yaml) and the create step
# below call the legacy unversioned surface (decimal amounts), as launch.yaml does; they break if
# those paths are retired.
#
# Runs whether the flow passed or failed. An assertion that fails after quick-add has saved the
# expense used to leave a ₱177 (or ₱226.53, once edited) row in the demo account for every failed
# run. This deletes any such row through the API, matching on amount alone because the AI parse
# rewrites the description — logging in itself, because a failure at
# launch means `output.token` was never set. On a passing run the UI delete has already removed the
# row and this finds nothing.
onFlowComplete:
  - runScript:
      file: scripts/cleanup-expenses.js
      env:
        AMOUNTS: "177,226.53"
---
# Create the expense this flow edits through the API, rather than assuming it is already there.
#
# It used to rely on quick-add.yaml: first on a row an earlier run had left behind (Maestro runs a
# directory alphabetically, so edit-delete ran before quick-add and the dependency ran backwards),
# then by running quick-add.yaml itself. Neither holds now that quick-add deletes its own row when
# it completes, which it also does when run nested from here. A direct create also keeps this
# flow's subject, edit and delete, independent of the AI parse that quick-add exists to test.
- evalScript: |
    ${(function(){var h={'Content-Type': 'application/json'}; var t=json(http.post('http://localhost:8080/auth/login', {headers: h, body: JSON.stringify({email: GASTOSAI_EMAIL, password: GASTOSAI_PASSWORD})}).body).token; if (!t) { throw new Error('login failed: no token'); } http.post('http://localhost:8080/expenses', {headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t}, body: JSON.stringify({amount: 177, category: 'Meal Plan', description: 'lunch at Jollibee'})}); return 'created';})()}

# After the create, so the app's first load of the month already includes the row: the Expenses
# tab does not refetch when it is opened, so a row created after launch never appears.
- runFlow: launch.yaml

- tapOn:
    id: "tab-expenses"
- extendedWaitUntil:
    visible: "(?i).*₱177.00.*"
    timeout: 20000
# By test id, not by amount: the day header shows the same ₱177.00 when that expense is the day's
# only one, and the header is not pressable — tapping the text hits it and does nothing.
- tapOn:
    id: "expense-row-first"
- assertVisible: "Edit expense"
# Confirm this is the row created above before touching it. The edit field is filled by
# centavosToInput, so it reads "177.00" — not "177".
- assertVisible: "177.00"

- tapOn:
    id: "expense-amount"
- eraseText
- inputText: "226.53"
# Dismiss the decimal keypad before reaching for Save: it has no return key of its own and it
# covers the button. Skipping this does not fail cleanly — the tap lands on a keypad digit and
# appends it to the amount, so the flow saves a different number than it typed.
- tapOn:
    id: "amount-done"
- tapOn: "Save changes"

# The edit must show up in the list, not merely be accepted by the server.
- extendedWaitUntil:
    visible: "(?i).*₱226.53.*"
    timeout: 20000

# Delete it, restoring the database to its prior state.
- tapOn:
    id: "expense-row-first"
- assertVisible: "Edit expense"
- assertVisible: "226.53"
- tapOn: "Delete expense"
- assertVisible: "Delete expense?"
- tapOn: "Delete"

- extendedWaitUntil:
    notVisible: "(?i).*₱226.53.*"
    timeout: 20000
