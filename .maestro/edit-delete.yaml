# Edit then delete an expense — the capture loop's correction path.
#
# Until v0.2 this was impossible in the app at all: the API wrappers existed with no UI. This
# asserts the hole is closed from the user's side, and cleans up after itself so the flow can be
# re-run against a shared dev database.
#
# Depends on quick-add.yaml having created the ₱177.00 expense.
#
# **Entered from the Expenses tab, not Home's Recent card.** Home became a dashboard in v0.7, so
# Recent now sits below seven cards: reaching it needs a scroll, and how far depends on how many
# cards happen to render. Expenses is where you would actually go to open an expense, it is scoped
# to the current month, and its list starts at the top of the screen.
#
# Matching on the amount is safe *on this screen specifically* — Expenses has no month-total tile,
# so ₱226.53 appears exactly once. On Home the same string appears twice and the tile is not
# pressable, which is why an earlier version of this flow tapped nothing and failed a step later.
#
# Before anything is deleted the flow re-opens the row and checks the amount on the edit screen, so
# a mistargeted row cannot be destroyed silently. Matching loosely on a round ₱175.00 is how a
# seeded expense was lost during the original Maestro bring-up.
appId: host.exp.Exponent
---
- runFlow: launch.yaml

# Create the expense this flow edits, rather than assuming it is already there.
#
# The header used to say this "depends on quick-add.yaml having created the ₱177.00 expense", but
# Maestro runs a directory alphabetically: edit-delete is third and quick-add eleventh, so the
# dependency ran backwards on every suite run. It only ever passed on an expense left behind by an
# earlier run — and failed the moment it was run against a clean account, which is exactly when a
# suite should be trustworthy. quick-add ends on Home in the current month, where this starts.
- runFlow: quick-add.yaml

- tapOn:
    id: "tab-expenses"
- extendedWaitUntil:
    visible: "(?i).*₱177.00.*"
    timeout: 20000
# By test id, not by amount: the day header shows the same ₱177.00 when that expense is the day's
# only one, and the header is not pressable — tapping the text hits it and does nothing.
- tapOn:
    id: "expense-row-first"
- assertVisible: "Edit expense"
# Confirm this is the row quick-add created before touching it.
- assertVisible: "177"

- tapOn:
    id: "expense-amount"
- eraseText
- inputText: "226.53"
# Dismiss the decimal keypad before reaching for Save: it has no return key of its own and it
# covers the button. Skipping this does not fail cleanly — the tap lands on a keypad digit and
# appends it to the amount, so the flow saves a different number than it typed.
- tapOn:
    id: "amount-done"
- tapOn: "Save changes"

# The edit must show up in the list, not merely be accepted by the server.
- extendedWaitUntil:
    visible: "(?i).*₱226.53.*"
    timeout: 20000

# Delete it, restoring the database to its prior state.
- tapOn:
    id: "expense-row-first"
- assertVisible: "Edit expense"
- assertVisible: "226.53"
- tapOn: "Delete expense"
- assertVisible: "Delete expense?"
- tapOn: "Delete"

- extendedWaitUntil:
    notVisible: "(?i).*₱226.53.*"
    timeout: 20000
