# How Home behaves when the backend is unreachable.
#
# **Precondition: the backend must be STOPPED.** This flow is therefore excluded from the normal
# suite run — every other flow requires it up. Run it deliberately:
#
#     lsof -ti :8080 | xargs kill -9
#     maestro test .maestro/offline.yaml
#
# It exists because this is a state a real user hits — a dropped connection, a server restart — and
# because the dashboard multiplied the risk: nine independent queries could have produced nine
# stacked error boxes on the one screen meant to be scannable.
#
# Two things are asserted. Home offers a way to recover, which it did not before v0.7 — it showed
# the message alone and left pull-to-refresh as the undiscoverable way out. And Home's sections,
# and the cards inside Insights once opened, render *nothing* rather than each reporting its own
# failure (TEN-444).
appId: host.exp.Exponent
# Tagged `manual` so the suite skips it — see config.yaml. Naming the file still runs it.
tags:
  - manual
---
- launchApp:
    clearState: false
- runFlow:
    when:
      notVisible: "Home"
    commands:
      - tapOn: "(?i).*gastosai.*"

- tapOn:
    id: "tab-home"

# The client's own wording for "no response at all", from `errorMessage` in src/api/client.ts —
# a network failure has no response body to quote, so this string is the app's, not the server's.
- extendedWaitUntil:
    visible: "(?i).*cannot reach the server.*"
    timeout: 40000
- assertVisible:
    id: "home-retry"

# Silence from the sections is the point: no "nothing needs attention" (which would claim there is
# nothing due), no empty goals strip, and no status line built from figures that never arrived —
# "No budget set" or "₱0.00 left" would be a false statement, not an error.
- assertNotVisible:
    id: "needs-attention"
- assertNotVisible:
    id: "card-goals"
- assertNotVisible:
    id: "home-status"

# Insights stays a plain collapsed toggle, and opening it offline adds no error boxes: each card in
# it renders nothing when its query fails.
# Centred, not merely "visible": at the bottom edge the toggle sits under the tab bar, and a tap
# there lands on the Budgets tab instead.
- scrollUntilVisible:
    element:
      id: "insights-toggle"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "insights-toggle"
- assertNotVisible:
    id: "card-top"
- assertNotVisible:
    id: "card-categories"
- assertNotVisible:
    id: "trend-change"
