# Opens the project inside Expo Go and gets to a signed-in Home screen.
#
# `launchApp` alone lands on Expo Go's own home screen — it starts the host app, not our project.
# Tapping the entry under "Recently opened" needs no URL, so nothing here is machine-specific
# (the dev-server address moves with DHCP).
#
# Readiness is the **tab bar**, by test id — not any particular screen's text.
#
# It used to assert "spent this month". That is Home's sub-label *in the current month only*, so
# the probe silently depended on which tab the previous run happened to leave the app on, and on
# which month was selected. A demo-cleanup flow that ended on Expenses was enough to break every
# flow at launch.
#
# `tab-home` is an id this app sets, present on every authenticated screen and independent of month
# and tab. Matching Expo Go's own "Home" *text* was the original trap this comment warned about;
# an id cannot collide with it.
#
# Sign-in is conditional because the JWT in the Keychain expires. Every flow used to assume a
# session that some earlier manual run happened to leave behind; the day it lapsed, all four flows
# failed at their first assertion with nothing to suggest authentication was the cause. Nothing
# here depends on a session existing, and nothing disturbs one that does.
#
# Credentials come from `env` and default to the backend's local demo account (`gastos.demo.*` in
# application.properties) — dev defaults already committed there, not secrets. Override for any
# other environment: `maestro test --env GASTOSAI_EMAIL=... .maestro/<flow>.yaml`.
#
# Precondition: the project has been opened in Expo Go at least once on this simulator.
appId: host.exp.Exponent
env:
  GASTOSAI_EMAIL: demo@gastosai.dev
  GASTOSAI_PASSWORD: demo123
---
- launchApp:
    clearState: false

# Expo Go remembers a failed load and resumes straight back onto it, so restarting Metro leaves
# every later run stuck on "There was a problem running the requested app" — `launchApp` alone does
# not clear it, and the failure surfaces as a confusing assertion error further down. "Go Home"
# returns to the launcher, where the normal path below picks the project up again.
- runFlow:
    when:
      visible: "(?i).*problem running the requested app.*"
    commands:
      - tapOn: "Go Home"

- runFlow:
    when:
      notVisible:
        id: "tab-home"
    commands:
      # Matched loosely because Expo Go labels this entry with the manifest's `name`, and that
      # changed from the dev slug "gastosai-mobile" to "GastosAI" when the app got a real display
      # name. A literal match would have broken every flow at launch the moment app.json changed,
      # and Expo Go's cached entry can still show the old label until the manifest is re-fetched —
      # so this has to match both, not just the new one.
      - tapOn: "(?i).*gastosai.*"
      # The JS bundle has to download and evaluate before anything is assertable. Either the tab
      # bar or the sign-in screen settles this wait — which one arrives decides whether the next
      # block runs.
      #
      # Both alternatives are wrapped in `.*` because **Maestro matches a text regex against the
      # whole element, not a substring**. The subtitle renders as "Sign in to track your spending."
      # *with the full stop*, so a bare `sign in to track your spending` matches nothing — and
      # neither does `.*spent.*`, since the word on screen is "spending". This waited the full 90s
      # on a screen that was sitting there, correctly rendered, the entire time.
      - extendedWaitUntil:
          visible: "(?i)(.*sign in to track your spending.*|.*spent.*)"
          timeout: 90000

# Matched on the subtitle rather than "Sign in": that string is both the header title and the
# button, and it also appears on the sign-up screen's toggle link.
- runFlow:
    when:
      visible: "Sign in to track your spending."
    commands:
      - tapOn:
          id: "login-email"
      - inputText: ${GASTOSAI_EMAIL}
      - tapOn:
          id: "login-password"
      - inputText: ${GASTOSAI_PASSWORD}
      # Dismiss the keyboard first — it covers the button on the shorter simulators.
      - hideKeyboard
      # By id, not by text: "Sign in" is also the navigation header title, and a text match hits
      # that first and taps nothing at all.
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          visible:
            id: "tab-home"
          timeout: 30000
      # iOS offers to save the password to the Keychain. It is a system sheet drawn over the app,
      # so it swallows the next tap and the flow fails one step later on an assertion that has
      # nothing to do with the real cause. Conditional because it only appears when the OS decides
      # to offer it.
      - runFlow:
          when:
            visible: "Save Password?"
          commands:
            - tapOn: "Not Now"
