<!--
  GastosAI app mark. Rendered by scripts/brand/make-icons.sh via headless Chrome.

  Variants are driven by the `?v=` query string so every asset comes from one source of truth:
    (default)   full-bleed green tile      -> assets/icon.png, favicon
    v=fg        glyph only, transparent    -> Android adaptive foreground
    v=bg        gradient only              -> Android adaptive background
    v=mono      flat white line drawing    -> Android monochrome (themed icons)
    v=splash    glyph only, full size      -> splash (its background colour comes from app.json)

  The drawing is the workspace's docs/brand/gastosai-app-icon.svg, copied verbatim into #art
  below. Edit it there first, then paste it here; never redraw it by eye.

  Design constraints, in order of authority:
    1. It has to read at 60px.
    2. Green, per the brand decision: the app's own accent is #1f8a5b (src/theme/index.ts).
    3. Piso's silhouette, not the ₱ glyph over rising bars. On 2026-11-19 the ₱-and-bars
       identity was replaced by the Piso mark — a bamboo alkansya with a coin sinking into it —
       so there is one mark across web, mobile and in-app: the web favicon and navbar, this icon,
       and the small Piso the app itself draws below 32px are the same drawing.
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; width: 1024px; height: 1024px; }

  /* #art paints in the master's colours via var() fallbacks, so the mono variant can reuse the
     same geometry through <use> and only change the paint. */
  .knockout { --line: #fff; --body: #000; --coin: #fff; --leaf: #000; --leaf-shown: none; }

  .fit { transform-box: view-box; transform-origin: 50% 50%; }
  .silhouette { display: none; }

  /* Android adaptive foreground: the launcher masks to the middle 72/108 and can zoom, so the
     glyph is pulled into the 66/108 safe circle. The leaf tip is the farthest point from the
     centre; at .66 it sits ~307px out against a 313px safe radius. */
  body.fg .tile, body.mono .tile, body.splash .tile { display: none; }
  body.fg .fit, body.mono .fit { transform: scale(.66); }
  body.bg .colour { display: none; }
  body.mono .colour { display: none; }
  body.mono .silhouette { display: inline; }
</style>
<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#24a06a"/><stop offset=".46" stop-color="#1f8a5b"/><stop offset="1" stop-color="#003c33"/></linearGradient>
    <g id="art">
      <path d="M45 22c3-9 10-12 15-11-1 6-6 12-15 11z" style="fill: var(--leaf, #9fe3c9); stroke: var(--line, #003c33); display: var(--leaf-shown, inline)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="32" cy="15" r="8.5" style="fill: var(--coin, #f0dca0); stroke: var(--line, #003c33)" stroke-width="4"/>
      <rect x="19" y="19" width="26" height="41" rx="7" style="fill: var(--body, #9fe3c9); stroke: var(--line, #003c33)" stroke-width="4"/>
      <path d="M14.5 33h35M14.5 47h35" style="stroke: var(--line, #003c33)" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <!-- Mono: Android reads only alpha, so everything is opaque white and the tube's fill is cut
         out. The coin stays a solid disc: as a ring meeting the tube's top edge it read as a
         padlock at 48px. The tube's fill still paints (as a hole), so the coin stops at the
         tube's top edge instead of showing through it. The leaf is dropped: on a launcher the glyph lands near
         30px, under the 48px below which docs/brand/README.md says the leaf turns to noise. -->
    <mask id="mono" maskUnits="userSpaceOnUse" x="-8" y="-8" width="80" height="80">
      <use href="#art" class="knockout"/>
    </mask>
  </defs>
  <rect class="tile" width="64" height="64" fill="url(#g)"/>
  <g class="fit">
    <g transform="translate(5 5.5) scale(.8125)">
      <use class="colour" href="#art"/>
      <rect class="silhouette" x="-8" y="-8" width="80" height="80" fill="#fff" mask="url(#mono)"/>
    </g>
  </g>
</svg>
<script>
  const v = new URLSearchParams(location.search).get("v");
  if (v) document.body.className = v;
</script>
